<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Annuaire du Lycée</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d6cdf">
</head>

<body>

<h1>Annuaire du Lycée</h1>

<input type="text" id="search" placeholder="Rechercher un élève...">

<button id="darkToggle">🌙 Mode</button>
<button id="backBtn" class="hidden">⬅ Retour</button>

<!-- CLASSES -->
<div id="classes"></div>

<!-- APP -->
<div class="container">

    <div id="annuaire"></div>

    <div id="fiche" class="hidden">

        <img id="photo" class="photo" src="https://via.placeholder.com/120">

        <input type="file" id="photoInput" accept="image/*" class="hidden">

        <h2 id="nomComplet"></h2>

        <p><b>Classe :</b> <span id="classe"></span></p>
        <p><b>Session :</b> <span id="session"></span></p>
        <p><b>Email :</b> <span id="email"></span></p>
        <p><b>Téléphone :</b> <span id="telephone"></span></p>

        <h3>Description</h3>
        <textarea id="description"></textarea>

        <button id="deleteBtn" class="hidden">🗑 Supprimer</button>

    </div>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="hidden">
    <h3>➕ Ajouter élève (ADMIN)</h3>

    <input id="newPrenom" placeholder="Prénom">
    <input id="newNom" placeholder="Nom">
    <input id="newClasse" placeholder="Classe">
    <textarea id="newDesc" placeholder="Description"></textarea>

    <button onclick="ajouterEleve()">Ajouter</button>
</div>

<!-- FEEDBACK -->
<div id="feedback" class="hidden"></div>
<canvas id="confetti"></canvas>

<script src="script.js"></script>

</body>
</html>
