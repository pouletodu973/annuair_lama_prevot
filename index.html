<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Annuaire du Lycée</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Annuaire du Lycée</h1>

<button id="backBtn" class="hidden">⬅ Retour</button>

<button id="darkToggle">🌙 Mode sombre</button>

<div id="adminPanel" class="hidden">
    <h3>Ajout élève (ADMIN)</h3>
    <input id="newPrenom" placeholder="Prénom">
    <input id="newNom" placeholder="Nom">
    <input id="newClasse" placeholder="Classe">
    <textarea id="newDesc" placeholder="Description"></textarea>
    <button onclick="ajouterEleve()">Ajouter</button>
</div>

<input type="text" id="search" placeholder="Rechercher un élève...">

<!-- FILTRES CLASSES -->
<div id="classes"></div>

<div class="container">
    <div id="annuaire"></div>

    <div id="fiche" class="hidden">
        <h2 id="nomComplet"></h2>
        <p><strong>Classe :</strong> <span id="classe"></span></p>

        <h3>Description</h3>
        <textarea id="description" rows="8"></textarea>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
